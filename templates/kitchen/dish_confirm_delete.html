{% extends "base.html" %}

{% block content %}

<h1>Delete dish</h1>

<p>
    Are you sure you want to delete
    <strong>{{ object.name }}</strong>?
</p>

<form method="post">
    {% csrf_token %}

    <button type="submit" class="btn btn-danger">
        Delete
    </button>

    <a href="{% url 'kitchen:dish-detail' object.pk %}"
       class="btn btn-secondary">
        Cancel
    </a>
</form>

{% endblock %}
