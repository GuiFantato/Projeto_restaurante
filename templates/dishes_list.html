
<h1>
Dishes List
<a href="{% url 'kitchen:dish-create' %}" class="btn btn-primary link-to-page">
    Create
</a>
</h1>

<ul>
    {% for dish in object_list %}
        <li>
            <strong>{{ dish.name }}</strong><br>
            {{ dish.description }}<br>
            R$ {{ dish.price }}<br>
            Tipo: {{ dish.dish_type }}
        </li>
    {% empty %}
        <li>Nenhum prato cadastrado.</li>
    {% endfor %}
</ul>
